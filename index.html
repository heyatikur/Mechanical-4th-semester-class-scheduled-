<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমার ক্লাস রুটিন</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--ac:#2563eb;--acbg:#e8efff;--ok:#16a34a;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c25;--tx:#eef0f4;--mu:#9aa3b2;--ac:#6ea0ff;--acbg:#1d2740;--ok:#4ade80;--bd:#272c38}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c25;--tx:#eef0f4;--mu:#9aa3b2;--ac:#6ea0ff;--acbg:#1d2740;--ok:#4ade80;--bd:#272c38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali",system-ui,sans-serif;max-width:560px;margin:auto;padding:16px}
h1{font-size:20px;margin:4px 0}
.sub{color:var(--mu);font-size:13px}
.now{background:var(--ac);color:#fff;border-radius:14px;padding:14px;margin:14px 0}
.now small{opacity:.85;display:block;font-size:12px}
.now b{font-size:17px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:1;min-width:64px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 4px;font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tab.today:not(.on){border-color:var(--ac);color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px;border-left:5px solid var(--ac)}
.c.cur{background:var(--acbg);border-color:var(--ac)}
.c.done{opacity:.5}
.c.free{border-left-color:var(--bd);background:transparent;color:var(--mu);padding:8px 12px;font-size:13px}
.t{font-size:12px;color:var(--mu);display:flex;justify-content:space-between}
.n{font-size:16px;font-weight:600;margin:4px 0}
.m{font-size:13px;color:var(--mu)}
.badge{color:var(--ok);font-weight:600}
</style>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#2563eb"></head>
<body>
<h1>📚 আমার ক্লাস রুটিন</h1>
<div class="sub">Mechanical Tech · 4th Semester · Group B · 2nd Shift</div>
<div id="now" class="now"></div>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
